<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нотатки — UDC WS8</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Нотатки</h1>
      <label>
        Я увійшов як
        <select id="user">
          <option value="1">Оля</option>
          <option value="2">Тарас</option>
        </select>
      </label>
    </header>

    <form id="new-note">
      <input id="title" placeholder="Заголовок" required />
      <input id="body" placeholder="Текст" />
      <button type="submit">Додати</button>
    </form>

    <div id="filters" role="group" aria-label="Які нотатки показати">
      <button type="button" data-archived="0" aria-pressed="true">Активні</button>
      <button type="button" data-archived="1" aria-pressed="false">Архів</button>
    </div>

    <ul id="notes"></ul>
    <!--
      Both messages stay in the accessibility tree with an empty string rather
      than being toggled with `hidden`: a live region that is removed from the
      tree and put back does not reliably announce.
    -->
    <p id="empty" role="status">Нотаток поки немає.</p>
    <p id="error" role="alert"></p>

    <script type="module" src="./app.js"></script>
  </body>
</html>
